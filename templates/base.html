{% load static codeguard_tags %}<!doctype html>
<html lang="en"{% for name, value in html_attrs.items %} {{ name }}="{{ value }}"{% endfor %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% theme_init_script %}
  <title>{% block title %}CodeGuard{% endblock %} · CodeGuard</title>
  <meta name="description" content="{% block meta_description %}CodeGuard models how a compromise could propagate through the stages of a software supply chain, and how much risk security controls remove.{% endblock %}">
  <meta property="og:site_name" content="CodeGuard">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% block og_title %}CodeGuard: software supply chain risk simulation{% endblock %}">
  <meta property="og:description" content="Model how a compromise could spread from a developer workstation to production, and how much risk each security control removes.">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="{% static 'images/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'vendor/fonts/fonts.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/codeguard.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}">
<a class="cg-skip" href="#main">Skip to main content</a>
{% block body %}{% endblock %}
<div class="cg-tooltip" id="cg-tooltip" role="tooltip" hidden></div>
<script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
<script src="{% static 'js/app.js' %}"></script>
</body>
</html>
