# Supplementary CI. Jenkins (Jenkinsfile) is the primary pipeline; this mirrors its quality gates.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a newly published vulnerability in a dependency is caught even when nothing is pushed.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: codeguard.test_settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Static checks
        run: |
          ruff check .
          ruff format --check .
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Tests with coverage
        run: pytest --cov --cov-report=term --cov-report=xml
      - name: Core coverage gate
        run: coverage report --include=simulation/engine.py,simulation/risk.py,simulation/propagation.py,simulation/recommendations.py --fail-under=85
      - name: Deployment configuration check
        run: python scripts/ci_deploy_check.py
      - name: Dependency audit
        run: python scripts/ci_dependency_audit.py
